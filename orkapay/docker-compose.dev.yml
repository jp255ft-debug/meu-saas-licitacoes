version: '3.8'

services:
  # Banco de dados do cashin
  cashin-db:
    image: postgres:16-alpine
    container_name: orkapay-cashin-db
    environment:
      POSTGRES_USER: cashin
      POSTGRES_PASSWORD: cashin
      POSTGRES_DB: cashin
    ports:
      - "5434:5432"
    volumes:
      - cashin_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Banco de dados do cashout
  cashout-db:
    image: postgres:16-alpine
    container_name: orkapay-cashout-db
    environment:
      POSTGRES_USER: cashout
      POSTGRES_PASSWORD: cashout
      POSTGRES_DB: cashout
    ports:
      - "5435:5432"
    volumes:
      - cashout_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashout"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API cashin
  cashin-api:
    build:
      context: ./services/cashin-engine
      dockerfile: Dockerfile
    container_name: orkapay-cashin-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://cashin:cashin@cashin-db:5432/cashin?sslmode=disable
      SERVER_PORT: 8080
      API_KEYS: demo-key:ClienteDemo,teste:Teste
      LOG_LEVEL: debug
    depends_on:
      cashin-db:
        condition: service_healthy

  # API cashout
  cashout-api:
    build:
      context: ./services/cashout-engine
      dockerfile: Dockerfile
    container_name: orkapay-cashout-api
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://cashout:cashout@cashout-db:5432/cashout?sslmode=disable
      SERVER_PORT: 8080
      API_KEYS: demo-key:ClienteDemo,teste:Teste
      LOG_LEVEL: debug
    depends_on:
      cashout-db:
        condition: service_healthy

volumes:
  cashin_data:
  cashout_data: