name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6:00 UTC

jobs:
  audit:
    name: Code Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Audit Script
        run: bash scripts/audit.sh

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: reports/audit/
          retention-days: 30

      - name: Check Audit Score
        run: |
          SCORE=$(cat reports/audit/report.json | python3 -c "import sys,json; print(json.load(sys.stdin)['score'])")
          echo "Audit score: $SCORE%"
          if [ "$SCORE" -lt 70 ]; then
            echo "❌ Audit score below 70% threshold!"
            exit 1
          fi