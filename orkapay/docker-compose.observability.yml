version: '3.8'

services:
  # Jaeger - Rastreamento distribuído (tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: orkapay-jaeger
    ports:
      - "16686:16686"   # UI do Jaeger
      - "4318:4318"     # OTLP HTTP
      - "4317:4317"     # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    networks:
      - orkapay-network

  # Prometheus - Métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: orkapay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - orkapay-network

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: orkapay-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
    networks:
      - orkapay-network

networks:
  orkapay-network:
    external: true