# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'orkapay-cashin'
    static_configs:
      - targets: ['cashin-api:8080']
    metrics_path: '/metrics'

  - job_name: 'orkapay-cashout'
    static_configs:
      - targets: ['cashout-api:8080']
    metrics_path: '/metrics'