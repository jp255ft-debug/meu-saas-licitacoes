groups:
  - name: orkapay_alerts
    rules:
      - alert: APIHighErrorRate
        expr: rate(orkapay_requests_total{status=~"5.."}[5m]) / rate(orkapay_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Alta taxa de erro na API ({{ $value | humanizePercentage }})"
          description: "Taxa de erro 5xx acima de 5% nos últimos 5 minutos"

      - alert: APIDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API {{ $labels.job }} está offline"
          description: "A API não responde há mais de 2 minutos"

      - alert: VolumeTransacoesAnomalo
        expr: rate(orkapay_invoices_created_total[5m]) > rate(orkapay_invoices_created_total[1h]) * 3
        for: 5m
        labels:
          severity: warning
          team: business
        annotations:
          summary: "Volume anômalo de criação de faturas"
          description: "Volume 3x acima da média horária"

      - alert: ZeroInvoicesCreated
        expr: rate(orkapay_invoices_created_total[1h]) == 0
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Nenhuma fatura criada na última hora"
          description: "Possível problema no sistema de criação de faturas"