global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/alerts.yml"

scrape_configs:
  - job_name: 'cashin-engine'
    static_configs:
      - targets: ['cashin-api:8080']
    metrics_path: '/metrics'

  - job_name: 'cashout-engine'
    static_configs:
      - targets: ['cashout-api:8081']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']