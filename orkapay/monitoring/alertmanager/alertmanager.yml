route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'

receivers:
  - name: 'default'
    email_configs:
      - to: 'alerts@orkapay.com'
        from: 'monitoring@orkapay.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'monitoring@orkapay.com'
        auth_password: '${SMTP_PASSWORD}'
        require_tls: true

  - name: 'critical'
    email_configs:
      - to: 'oncall@orkapay.com'
        from: 'monitoring@orkapay.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'monitoring@orkapay.com'
        auth_password: '${SMTP_PASSWORD}'
        require_tls: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']