services:
  - type: web
    name: orkapay-cashin
    env: go
    buildCommand: cd services/cashin-engine && go build -o cashin ./cmd/api
    startCommand: cd services/cashin-engine && ./cashin
    plan: free
    envGroups:
      - orkapay-production
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: orkapay-cashout
    env: go
    buildCommand: cd services/cashout-engine && go build -o cashout ./cmd/api
    startCommand: cd services/cashout-engine && ./cashout
    plan: free
    envGroups:
      - orkapay-production
    healthCheckPath: /health
    autoDeploy: true